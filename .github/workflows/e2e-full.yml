name: E2E (Full Suite)

# The complete Playwright suite: 1,587 tests across 140 files, 4 Next.js dev
# servers. Far too slow to gate a PR, so it runs nightly and on demand while
# CI's `E2E Smoke` job guards every push.
#
# Sharded 4 ways. Each shard emits a blob report; the `merge` job combines them
# into one HTML report so you still get a single view of the run.

on:
  schedule:
    - cron: '30 19 * * *' # 01:00 IST
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards
        required: false
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build-time generated sources exist
        run: node scripts/ci/check-generated-artifacts.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run shard ${{ matrix.shard }}
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          CI: true
          PW_BLOB: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ secrets.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          # Graph app-only auth (packages/auth/src/graph.ts, nexus
          # graph-app-token.ts) reads AZ_*. `AZURE_AD_CLIENT_SECRET` used to be
          # passed here, but no code anywhere reads that name, so it was inert.
          AZ_CLIENT_ID: ${{ secrets.AZ_CLIENT_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
          AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          # See docs/CI_SECRETS.md.
          E2E_TEST_STUDENT_EMAIL: ${{ secrets.E2E_TEST_STUDENT_EMAIL }}
          E2E_TEST_STUDENT_PASSWORD: ${{ secrets.E2E_TEST_STUDENT_PASSWORD }}
          E2E_TEST_TEACHER_EMAIL: ${{ secrets.E2E_TEST_TEACHER_EMAIL }}
          E2E_TEST_TEACHER_PASSWORD: ${{ secrets.E2E_TEST_TEACHER_PASSWORD }}
          E2E_TEST_ADMIN_EMAIL: ${{ secrets.E2E_TEST_ADMIN_EMAIL }}
          E2E_TEST_ADMIN_PASSWORD: ${{ secrets.E2E_TEST_ADMIN_PASSWORD }}
          E2E_TEST_APP_EMAIL: ${{ secrets.E2E_TEST_APP_EMAIL }}
          E2E_TEST_APP_PASSWORD: ${{ secrets.E2E_TEST_APP_PASSWORD }}
          E2E_TEST_PARENT_LOGIN_ID: ${{ secrets.E2E_TEST_PARENT_LOGIN_ID }}
          E2E_TEST_PARENT_PASSWORD: ${{ secrets.E2E_TEST_PARENT_PASSWORD }}
          E2E_STAFF_SECRET: ${{ secrets.E2E_STAFF_SECRET }}
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge:
    name: Merge reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
