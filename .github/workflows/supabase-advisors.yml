name: Supabase security advisors (weekly)

# Once a week, reads the Supabase security advisor for prod and staging and
# compares it with .claude/skills/supabase-security/accepted.json. When there
# are findings that are not in the accepted list, it opens (or updates) ONE
# issue labelled supabase-security; when there are none, it closes that issue.
# The fixing happens in Claude Code: run /supabase-security at the repo root.
#
# Secrets (already used by deploy.yml): SUPABASE_ACCESS_TOKEN,
# SUPABASE_PROJECT_ID_STAGING, SUPABASE_PROJECT_ID_PRODUCTION.
#
# Safety: the repo is public, so the raw advisor output stays in $RUNNER_TEMP
# and is never printed. The issue and the job summary carry counts per rule,
# never table, view or function names.
#
# The advisors endpoint is marked experimental by Supabase. If it starts
# failing, this job fails loudly rather than reporting "all clear".

on:
  schedule:
    - cron: '30 4 * * 1' # Mondays 10:00 IST
  workflow_dispatch:

concurrency:
  group: supabase-advisors
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  advisors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: supabase-security
      TITLE: Supabase security advisors need attention
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .claude/skills/supabase-security

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF_PROD: ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
          REF_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
        run: |
          set -euo pipefail
          for env in prod staging; do
            if [ "$env" = prod ]; then ref="$REF_PROD"; else ref="$REF_STAGING"; fi
            curl -fsS --retry 3 --retry-delay 10 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$ref/advisors/security" \
              -o "$RUNNER_TEMP/$env.json"
          done

      - name: Triage against the accepted list
        id: triage
        run: |
          set -euo pipefail
          node .claude/skills/supabase-security/triage.mjs \
            prod="$RUNNER_TEMP/prod.json" staging="$RUNNER_TEMP/staging.json" --ci \
            > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.triage.outputs.new_count != '0'
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 --description "Supabase security advisor findings" --force
          n=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          {
            cat "$RUNNER_TEMP/body.md"
            echo
            echo "_Checked $(date -u +%Y-%m-%d) by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)._"
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the issue when all clear
        if: steps.triage.outputs.new_count == '0'
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "All clear on $(date -u +%Y-%m-%d): no security advisor findings outside the accepted list."
          done
